name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.editor }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    # a break in tomorrow's Vim or Neovim is not a break in the plugin
    continue-on-error: ${{ matrix.version == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { editor: vim, version: stable }
          - { editor: vim, version: nightly }
          # the oldest Neovim the tree-sitter support claims to work with
          - { editor: neovim, version: v0.11.0 }
          - { editor: neovim, version: stable }
          - { editor: neovim, version: nightly }

    steps:
      - uses: actions/checkout@v5

      - uses: rhysd/action-setup-vim@v1
        id: editor
        with:
          version: ${{ matrix.version }}
          neovim: ${{ matrix.editor == 'neovim' }}

      - name: Run the test suite
        env:
          EDITOR_BIN: ${{ steps.editor.outputs.executable }}
        run: |
          if [ '${{ matrix.editor }}' = neovim ]; then
            NVIM="$EDITOR_BIN" test/run.sh nvim
          else
            VIM="$EDITOR_BIN" test/run.sh vim
          fi
